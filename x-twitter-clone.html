<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in to X</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, Helvetica, Arial, sans-serif; }
  body {
    background:#000;
    color:#fff;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .card {
    max-width:380px;
    width:100%;
    text-align:center;
  }
  .logo { font-size:48px; margin-bottom:30px; }
  h1 { font-size:2rem; font-weight:800; margin-bottom:30px; }
  input {
    width:100%;
    padding:14px 12px;
    font-size:15px;
    background:#000;
    color:#fff;
    border:1px solid #333;
    border-radius:4px;
    margin-bottom:14px;
    outline:none;
  }
  input:focus { border-color:#1d9bf0; }
  button {
    width:100%;
    padding:12px;
    font-size:15px;
    font-weight:700;
    border:none;
    border-radius:24px;
    cursor:pointer;
  }
  .btn-next {
    background:#fff;
    color:#000;
    margin-top:10px;
  }
  .btn-next:hover { background:#e6e6e6; }
  .divider {
    display:flex;
    align-items:center;
    color:#71767b;
    font-size:14px;
    margin:24px 0;
  }
  .divider::before, .divider::after {
    content:"";
    flex:1;
    height:1px;
    background:#333;
  }
  .divider::before { margin-right:16px; }
  .divider::after { margin-left:16px; }
  .signup {
    font-size:14px;
    color:#71767b;
    margin-top:30px;
  }
  .signup a { color:#1d9bf0; text-decoration:none; }
  footer {
    text-align:center;
    font-size:12px;
    color:#71767b;
    margin-top:30px;
    max-width:380px;
    position:absolute;
    bottom:20px;
  }
</style>
</head>
<body>

<div class="card">
  <div class="logo">𝕏</div>
  <h1>Sign in to X</h1>
  <form id="loginForm">
    <input type="text" placeholder="Phone, email, or username" required>
    <input type="password" placeholder="Password" required>
    <button type="submit" class="btn-next">Log in</button>
  </form>
  <div class="divider">or</div>
  <div class="signup">Don't have an account? <a href="https://x.com">Sign up</a></div>
</div>

<footer>Static UI clone built for front-end practice. No data is collected or stored — submitting forwards you to the real X.</footer>

<script>
  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    window.location.href = "https://x.com";
  });
</script>

</body>
</html>
