<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatGPT-style App</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, Helvetica, Arial, sans-serif; }
  body { display:flex; height:100vh; background:#fff; }
  .sidebar {
    width:260px;
    background:#171717;
    color:#ececec;
    display:flex;
    flex-direction:column;
    padding:12px;
  }
  .new-chat {
    border:1px solid #4d4d4f;
    border-radius:8px;
    padding:10px;
    font-size:14px;
    cursor:pointer;
    margin-bottom:16px;
  }
  .new-chat:hover { background:#2a2a2a; }
  .history { flex:1; overflow-y:auto; font-size:13px; }
  .history-item { padding:8px; border-radius:6px; cursor:pointer; color:#c5c5c5; margin-bottom:2px; }
  .history-item:hover { background:#2a2a2a; }
  .main { flex:1; display:flex; flex-direction:column; }
  .chat-area { flex:1; overflow-y:auto; padding:30px 20px; max-width:700px; margin:0 auto; width:100%; }
  .msg { margin-bottom:24px; display:flex; gap:12px; }
  .avatar { width:28px; height:28px; border-radius:4px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:14px; color:#fff; }
  .avatar.user { background:#19c37d; }
  .avatar.bot { background:#000; }
  .msg-text { font-size:15px; line-height:1.6; color:#2d2d2d; padding-top:3px; }
  .input-area { padding:16px 20px 24px; display:flex; justify-content:center; }
  .input-wrap {
    max-width:700px;
    width:100%;
    display:flex;
    border:1px solid #d9d9e3;
    border-radius:24px;
    padding:10px 16px;
    box-shadow:0 2px 6px rgba(0,0,0,0.08);
  }
  .input-wrap input {
    flex:1;
    border:none;
    outline:none;
    font-size:15px;
  }
  .input-wrap button {
    border:none;
    background:#000;
    color:#fff;
    width:30px;
    height:30px;
    border-radius:50%;
    cursor:pointer;
    font-size:14px;
  }
  .input-wrap button:hover { background:#333; }
  @media (max-width:700px){ .sidebar { display:none; } }
</style>
</head>
<body>

<div class="sidebar">
  <div class="new-chat">+ New chat</div>
  <div class="history">
    <div class="history-item">Explaining recursion</div>
    <div class="history-item">Resume feedback</div>
    <div class="history-item">Trip planning ideas</div>
  </div>
</div>

<div class="main">
  <div class="chat-area" id="chatArea">
    <div class="msg">
      <div class="avatar user">U</div>
      <div class="msg-text">Hi! Can you explain what this app is?</div>
    </div>
    <div class="msg">
      <div class="avatar bot">AI</div>
      <div class="msg-text">This is a front-end mockup of a ChatGPT-style chat interface — layout and styling only, no real AI backend connected.</div>
    </div>
  </div>
  <div class="input-area">
    <div class="input-wrap">
      <input type="text" id="msgInput" placeholder="Message ChatGPT-style app...">
      <button id="sendBtn">↑</button>
    </div>
  </div>
</div>

<script>
  const chatArea = document.getElementById('chatArea');
  const input = document.getElementById('msgInput');
  function send(){
    const text = input.value.trim();
    if(!text) return;
    const userMsg = document.createElement('div');
    userMsg.className = 'msg';
    userMsg.innerHTML = '<div class="avatar user">U</div><div class="msg-text"></div>';
    userMsg.querySelector('.msg-text').textContent = text;
    chatArea.appendChild(userMsg);
    input.value = '';
    setTimeout(()=>{
      const botMsg = document.createElement('div');
      botMsg.className = 'msg';
      botMsg.innerHTML = '<div class="avatar bot">AI</div><div class="msg-text">This is a static demo — no real model is generating this reply.</div>';
      chatArea.appendChild(botMsg);
      chatArea.scrollTop = chatArea.scrollHeight;
    }, 400);
    chatArea.scrollTop = chatArea.scrollHeight;
  }
  document.getElementById('sendBtn').addEventListener('click', send);
  input.addEventListener('keydown', e => { if(e.key==='Enter') send(); });
</script>

</body>
</html>
