<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amazon Sign-In</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: Arial, Helvetica, sans-serif; }
  body { background:#fff; }
  header {
    text-align:center;
    padding:20px 0;
  }
  header .logo { font-size:2rem; font-weight:700; color:#000; text-decoration:none; }
  header .logo span { color:#f90; }
  .wrapper {
    display:flex;
    justify-content:center;
    padding:10px 20px 40px;
  }
  .card {
    border:1px solid #ddd;
    border-radius:8px;
    max-width:350px;
    width:100%;
    padding:20px;
  }
  h1 { font-size:1.5rem; font-weight:400; margin-bottom:16px; }
  label { font-size:13px; font-weight:700; display:block; margin-bottom:4px; }
  input {
    width:100%;
    padding:8px 10px;
    font-size:15px;
    border:1px solid #a6a6a6;
    border-radius:3px;
    margin-bottom:16px;
    outline:none;
  }
  input:focus { border-color:#e77600; box-shadow:0 0 3px 2px rgba(228,121,17,0.5); }
  button {
    width:100%;
    padding:8px;
    font-size:14px;
    border:1px solid #a88734;
    border-radius:8px;
    cursor:pointer;
    background:linear-gradient(to bottom,#f7dfa5,#f0c14b);
  }
  button:hover { background:linear-gradient(to bottom,#f5d78e,#eeb933); }
  .fine-print { font-size:12px; color:#555; margin:16px 0; }
  .fine-print a { color:#0066c0; text-decoration:none; }
  hr { border:none; border-top:1px solid #e7e7e7; margin:16px 0; }
  .create-link {
    display:block;
    text-align:center;
    font-size:12px;
    color:#0066c0;
    text-decoration:none;
    border:1px solid #adb1b8;
    border-radius:8px;
    padding:8px;
  }
  .create-link:hover { background:#f7fafa; }
  footer {
    text-align:center;
    font-size:12px;
    color:#555;
    padding-bottom:30px;
  }
</style>
</head>
<body>

<header>
  <a href="#" class="logo">amazon<span>.in</span></a>
</header>

<div class="wrapper">
  <div class="card">
    <h1>Sign in</h1>
    <form id="loginForm">
      <label>Email or mobile phone number</label>
      <input type="text" required>
      <label>Password</label>
      <input type="password" required>
      <button type="submit">Sign in</button>
    </form>
    <p class="fine-print">By continuing, you agree to Amazon's Conditions of Use and Privacy Notice.</p>
    <hr>
    <a href="https://www.amazon.in" class="create-link">Create your Amazon account</a>
  </div>
</div>

<footer>Static UI clone built for front-end practice. No data is collected or stored — submitting forwards you to the real Amazon.</footer>

<script>
  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    window.location.href = "https://www.amazon.in";
  });
</script>

</body>
</html>
