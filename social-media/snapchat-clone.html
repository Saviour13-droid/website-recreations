<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snapchat</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: Helvetica, Arial, sans-serif; }
  body {
    background:#fffc00;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .card {
    background:#fff;
    border-radius:16px;
    max-width:360px;
    width:100%;
    padding:40px 30px;
    text-align:center;
    box-shadow:0 4px 20px rgba(0,0,0,0.15);
  }
  .ghost {
    font-size:70px;
    margin-bottom:10px;
  }
  h1 {
    font-size:1.6rem;
    color:#000;
    margin-bottom:24px;
    font-weight:800;
  }
  input {
    width:100%;
    padding:14px 16px;
    font-size:15px;
    border:none;
    background:#f2f2f2;
    border-radius:8px;
    margin-bottom:12px;
    outline:none;
  }
  input:focus { box-shadow:0 0 0 2px #fffc00; }
  button {
    width:100%;
    padding:14px;
    font-size:16px;
    font-weight:700;
    border:none;
    border-radius:24px;
    cursor:pointer;
    background:#000;
    color:#fffc00;
    margin-top:8px;
  }
  button:hover { background:#222; }
  .forgot {
    display:block;
    margin-top:18px;
    font-size:13px;
    color:#555;
    text-decoration:none;
  }
  .signup {
    margin-top:24px;
    font-size:14px;
    color:#000;
  }
  .signup a { color:#0a84ff; font-weight:600; text-decoration:none; }
  footer {
    text-align:center;
    font-size:12px;
    color:#444;
    margin-top:24px;
    max-width:360px;
  }
</style>
</head>
<body>

<div class="card">
  <div class="ghost">👻</div>
  <h1>Log in to Snapchat</h1>
  <form id="loginForm">
    <input type="text" placeholder="Username or email" required>
    <input type="password" placeholder="Password" required>
    <button type="submit">Log In</button>
  </form>
  <a href="#" class="forgot">Forgot your password?</a>
  <div class="signup">New to Snapchat? <a href="https://www.snapchat.com">Sign up</a></div>
</div>

<footer>Static UI clone built for front-end practice. No data is collected or stored — submitting forwards you to the real Snapchat.</footer>

<script>
  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    window.location.href = "https://www.snapchat.com";
  });
</script>

</body>
</html>
