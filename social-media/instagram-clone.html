<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body {
    background:#fafafa;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .wrapper { width:100%; max-width:350px; }
  .card {
    background:#fff;
    border:1px solid #dbdbdb;
    border-radius:1px;
    padding:36px 40px 20px;
    text-align:center;
    margin-bottom:10px;
  }
  .logo {
    font-family: 'Brush Script MT', cursive;
    font-size:3.2rem;
    margin-bottom:24px;
    color:#262626;
    letter-spacing:0.5px;
  }
  input {
    width:100%;
    padding:9px 8px 9px 10px;
    font-size:14px;
    background:#fafafa;
    border:1px solid #dbdbdb;
    border-radius:3px;
    margin-bottom:6px;
    outline:none;
  }
  input:focus { border-color:#a8a8a8; }
  button {
    width:100%;
    padding:8px;
    font-size:14px;
    font-weight:600;
    border:none;
    border-radius:8px;
    cursor:pointer;
    margin-top:8px;
  }
  .btn-login {
    background:#0095f6;
    color:#fff;
  }
  .btn-login:hover { background:#1877f2; }
  .divider {
    display:flex;
    align-items:center;
    color:#8e8e8e;
    font-size:13px;
    font-weight:600;
    margin:18px 0;
  }
  .divider::before, .divider::after {
    content:"";
    flex:1;
    height:1px;
    background:#dbdbdb;
  }
  .divider::before { margin-right:18px; }
  .divider::after { margin-left:18px; }
  .fb-login {
    color:#385185;
    font-size:14px;
    font-weight:600;
    text-decoration:none;
    display:block;
    margin-bottom:18px;
  }
  .forgot {
    color:#00376b;
    font-size:12px;
    text-decoration:none;
    display:block;
    margin-top:12px;
  }
  .signup-card {
    background:#fff;
    border:1px solid #dbdbdb;
    border-radius:1px;
    padding:20px;
    text-align:center;
    font-size:14px;
  }
  .signup-card a {
    color:#0095f6;
    font-weight:600;
    text-decoration:none;
  }
  footer {
    text-align:center;
    font-size:12px;
    color:#8a8d91;
    margin-top:30px;
    max-width:350px;
  }
</style>
</head>
<body>

<div class="wrapper">
  <div class="card">
    <div class="logo">Instagram</div>
    <form id="loginForm">
      <input type="text" placeholder="Phone number, username, or email" required>
      <input type="password" placeholder="Password" required>
      <button type="submit" class="btn-login">Log in</button>
    </form>
    <div class="divider">OR</div>
    <a href="#" class="fb-login">Log in with Facebook</a>
    <a href="#" class="forgot">Forgot password?</a>
  </div>

  <div class="signup-card">
    Don't have an account? <a href="https://www.instagram.com">Sign up</a>
  </div>
</div>

<footer>Static UI clone built for front-end practice. No data is collected or stored — submitting forwards you to the real Instagram.</footer>

<script>
  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    window.location.href = "https://www.instagram.com";
  });
</script>

</body>
</html>
