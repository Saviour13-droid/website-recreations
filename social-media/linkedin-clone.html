<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkedIn Login</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, Helvetica, Arial, sans-serif; }
  body { background:#f3f2ef; }
  nav {
    display:flex;
    align-items:center;
    padding:16px 40px;
  }
  nav .logo { color:#0a66c2; font-size:1.8rem; font-weight:800; }
  .container {
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:50px;
    max-width:1000px;
    margin:40px auto;
    padding:0 20px;
  }
  .left { flex:1; min-width:280px; }
  .left h1 {
    font-size:2.3rem;
    font-weight:400;
    color:#000;
    max-width:450px;
    line-height:1.3;
  }
  .right { flex:1; min-width:280px; max-width:380px; }
  .card {
    background:#fff;
    border-radius:8px;
    box-shadow:0 0 1px rgba(0,0,0,0.3);
    padding:24px;
  }
  label { font-size:14px; font-weight:600; display:block; margin-bottom:6px; }
  input {
    width:100%;
    padding:12px;
    font-size:16px;
    border:1px solid #666;
    border-radius:4px;
    margin-bottom:20px;
    outline:none;
  }
  input:focus { border:2px solid #0a66c2; }
  .forgot { color:#0a66c2; font-size:14px; text-decoration:none; display:block; margin-bottom:20px; margin-top:-10px; }
  button {
    width:100%;
    padding:12px;
    font-size:16px;
    font-weight:600;
    border:none;
    border-radius:24px;
    cursor:pointer;
    background:#0a66c2;
    color:#fff;
  }
  button:hover { background:#004182; }
  .divider {
    display:flex;
    align-items:center;
    color:#666;
    font-size:13px;
    margin:20px 0;
  }
  .divider::before, .divider::after {
    content:"";
    flex:1;
    height:1px;
    background:#ccc;
  }
  .divider::before { margin-right:12px; }
  .divider::after { margin-left:12px; }
  .signup { text-align:center; font-size:14px; }
  .signup a { color:#0a66c2; font-weight:600; text-decoration:none; }
  footer {
    text-align:center;
    font-size:12px;
    color:#666;
    margin-top:30px;
  }
  @media (max-width:700px){ .left h1 { text-align:center; margin:0 auto; } nav { justify-content:center; } }
</style>
</head>
<body>

<nav><span class="logo">in</span></nav>

<div class="container">
  <div class="left">
    <h1>Welcome to your professional community</h1>
  </div>
  <div class="right">
    <div class="card">
      <form id="loginForm">
        <label>Email or Phone</label>
        <input type="text" required>
        <label>Password</label>
        <input type="password" required>
        <a href="#" class="forgot">Forgot password?</a>
        <button type="submit">Sign in</button>
      </form>
      <div class="divider">or</div>
      <div class="signup">New to LinkedIn? <a href="https://www.linkedin.com">Join now</a></div>
    </div>
  </div>
</div>

<footer>Static UI clone built for front-end practice. No data is collected or stored — submitting forwards you to the real LinkedIn.</footer>

<script>
  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    window.location.href = "https://www.linkedin.com";
  });
</script>

</body>
</html>
