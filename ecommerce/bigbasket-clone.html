<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BigBasket Login</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: Arial, Helvetica, sans-serif; }
  body { background:#f4fbf4; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card {
    background:#fff;
    max-width:380px;
    width:100%;
    border-radius:10px;
    padding:36px 28px;
    box-shadow:0 2px 12px rgba(0,0,0,0.08);
    text-align:center;
  }
  .logo { font-size:1.7rem; font-weight:800; margin-bottom:4px; }
  .logo span:first-child { color:#84c225; }
  .logo span:last-child { color:#e42528; }
  p.tag { font-size:13px; color:#777; margin-bottom:26px; }
  input {
    width:100%;
    padding:12px 14px;
    font-size:15px;
    border:1px solid #ccc;
    border-radius:6px;
    margin-bottom:14px;
    outline:none;
  }
  input:focus { border-color:#84c225; }
  button {
    width:100%;
    padding:12px;
    font-size:15px;
    font-weight:700;
    border:none;
    border-radius:6px;
    cursor:pointer;
    background:#84c225;
    color:#fff;
    margin-top:6px;
  }
  button:hover { background:#6fa81f; }
  .new-user { margin-top:22px; font-size:13px; color:#555; }
  .new-user a { color:#e42528; font-weight:700; text-decoration:none; }
  footer { text-align:center; font-size:12px; color:#777; margin-top:20px; max-width:380px; }
</style>
</head>
<body>

<div class="card">
  <div class="logo"><span>Big</span><span>Basket</span></div>
  <p class="tag">India's largest online grocery store</p>
  <form id="loginForm">
    <input type="text" placeholder="Mobile number" required>
    <input type="password" placeholder="Password" required>
    <button type="submit">Login</button>
  </form>
  <div class="new-user">New to BigBasket? <a href="https://www.bigbasket.com">Sign up</a></div>
</div>

<footer>Static UI clone built for front-end practice. No data is collected or stored — submitting forwards you to the real BigBasket.</footer>

<script>
  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    window.location.href = "https://www.bigbasket.com";
  });
</script>

</body>
</html>
