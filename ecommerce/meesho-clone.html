<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meesho Login</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: Arial, Helvetica, sans-serif; }
  body { background:#fdf0f5; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card {
    background:#fff;
    max-width:380px;
    width:100%;
    border-radius:12px;
    padding:36px 28px;
    box-shadow:0 2px 12px rgba(0,0,0,0.08);
    text-align:center;
  }
  .logo { font-size:1.8rem; font-weight:800; color:#9f2089; margin-bottom:6px; }
  p.tag { font-size:13px; color:#888; margin-bottom:28px; }
  input {
    width:100%;
    padding:13px 14px;
    font-size:15px;
    border:1px solid #e0e0e0;
    border-radius:8px;
    margin-bottom:14px;
    outline:none;
  }
  input:focus { border-color:#9f2089; }
  button {
    width:100%;
    padding:13px;
    font-size:15px;
    font-weight:700;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#9f2089;
    color:#fff;
    margin-top:6px;
  }
  button:hover { background:#861a74; }
  .new-user { margin-top:24px; font-size:13px; color:#555; }
  .new-user a { color:#9f2089; font-weight:700; text-decoration:none; }
  footer { text-align:center; font-size:12px; color:#888; margin-top:20px; max-width:380px; }
</style>
</head>
<body>

<div class="card">
  <div class="logo">Meesho</div>
  <p class="tag">Shop online for the best products</p>
  <form id="loginForm">
    <input type="text" placeholder="Mobile number / Email" required>
    <input type="password" placeholder="Password" required>
    <button type="submit">Login</button>
  </form>
  <div class="new-user">New to Meesho? <a href="https://www.meesho.com">Create account</a></div>
</div>

<footer>Static UI clone built for front-end practice. No data is collected or stored — submitting forwards you to the real Meesho.</footer>

<script>
  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    window.location.href = "https://www.meesho.com";
  });
</script>

</body>
</html>
